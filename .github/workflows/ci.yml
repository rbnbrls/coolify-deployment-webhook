name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  issues: write

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest requests

      - name: Run tests
        run: |
          python -m pytest tests/ -v --tb=short

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results-${{ matrix.python-version }}
          path: |
            pytest-results.xml
            .pytest_cache/
          retention-days: 3

  create-issue-on-failure:
    needs: [test]
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v4

      - name: Collect failed matrix metadata
        id: matrix-info
        run: |
          echo "matrix_versions=3.11, 3.12" >> "$GITHUB_OUTPUT"

      - name: Create GitHub issue
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const runId = context.runId;
            const repo = context.repo;
            const runUrl = `${context.serverUrl}/${repo.owner}/${repo.repo}/actions/runs/${runId}`;
            const workflowUrl = `${context.serverUrl}/${repo.owner}/${repo.repo}/actions/workflows/${context.workflow}`;

            const title = `CI Test Failure — Run #${runId}`;
            const body = [
              `## CI Test Failure`,
              ``,
              `A test **failed** in workflow run **#${runId}**.`,
              ``,
              `| Detail | Value |`,
              `|--------|-------|`,
              `| **Workflow** | ${{ github.workflow }} |`,
              `| **Run ID** | ${runId} |`,
              `| **Branch** | ${context.ref} |`,
              `| **Commit** | ${context.sha} |`,
              `| **Trigger** | ${context.eventName} |`,
              `| **Author** | ${context.actor} |`,
              `| **Python versions** | ${{ steps.matrix-info.outputs.matrix_versions }} |`,
              ``,
              `🔗 [View workflow run](${runUrl})`,
              ``,
              `> This issue was automatically created when CI tests failed.`,
              `> Re-run the workflow to verify the fix.`,
            ].join('\n');

            await github.rest.issues.create({
              owner: repo.owner,
              repo: repo.repo,
              title: title,
              body: body,
              labels: ['ci-failure', 'automated']
            });
