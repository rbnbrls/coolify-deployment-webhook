---
name: CI

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest requests

      - name: Run tests
        run: |
          python -m pytest tests/ -v --tb=short --junitxml=pytest-results.xml

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results-${{ matrix.python-version }}
          path: |
            pytest-results.xml
            .pytest_cache/
          retention-days: 3

  quality:
    # Coverage runner (pytest-cov), lint (ruff) and type check (mypy).
    #
    # The coverage floor lives in .coveragerc ([report] fail_under), so one
    # number gates this job and a local `pytest --cov`. The machine-readable
    # report is `coverage.xml` at the repository root: it is committed, so a
    # reader (and the darkfactory quality lane) fetches it from `main`, where an
    # uploaded run artifact would have expired. This job republishes the run's
    # measurement there and fails while the committed copy no longer describes
    # this tree.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install quality tooling
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Type check (mypy)
        run: mypy

      - name: Tests with coverage (pytest-cov)
        run: |
          python -m pytest tests/ -q --tb=short \
            --cov --cov-report=term-missing \
            --cov-report=xml:coverage.xml

      - name: Publish the coverage report
        # The number a reader can trust is the *committed* report: the quality
        # lane reads `coverage.xml` from the default branch, while an uploaded
        # artifact expires and a log line is not durable evidence. This step
        # republishes this run's measurement at the repository root, normalising
        # away the timestamp; the next step refuses to pass while the committed
        # copy no longer describes this tree.
        if: always()
        run: |
          python scripts/coverage_report.py --summary | tee "$RUNNER_TEMP/coverage-summary.txt"
          status=${PIPESTATUS[0]}
          {
            echo "### Coverage"
            echo ""
            cat "$RUNNER_TEMP/coverage-summary.txt"
            echo ""
            echo "Published at \`coverage.xml\` (committed at the repository root)."
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: The committed coverage report must match this run
        # `coverage.xml` reaches `main` through the merge, never through a push
        # from this workflow: committing it here would need a write grant on the
        # workflow token. So CI measures, normalises and compares, and a change
        # that moves coverage has to republish the report in the same pull
        # request.
        run: |
          if git diff --exit-code -- coverage.xml; then
            echo "coverage.xml matches this run"
            exit 0
          fi
          echo "::error::coverage.xml is out of date; republish it with:"
          echo "::error::  python -m pytest tests/ --cov --cov-report=term-missing --cov-report=xml:coverage.xml"
          echo "::error::  python scripts/coverage_report.py --summary"
          git --no-pager diff --stat -- coverage.xml
          exit 1

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage.xml
            .coverage
          retention-days: 3

  create-issue-on-failure:
    needs: [test, quality]
    if: failure() && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Collect failed matrix metadata
        id: matrix-info
        run: |
          echo "matrix_versions=3.11, 3.12" >> "$GITHUB_OUTPUT"

      - name: Create GitHub issue
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # yamllint disable rule:line-length
          script: |
            const runId = context.runId;
            const repo = context.repo;
            const runUrl =
              `${context.serverUrl}/${repo.owner}/${repo.repo}/actions/runs/${runId}`;
            const marker = `<!-- ci-failure-run:${runId} -->`;

            const openIssues = await github.paginate(
              github.rest.issues.listForRepo,
              {
                owner: repo.owner,
                repo: repo.repo,
                state: 'open',
                per_page: 100,
              },
            );
            const existingIssue = openIssues.find(
              (issue) => issue.body && issue.body.includes(marker),
            );
            if (existingIssue) {
              await github.rest.issues.createComment({
                owner: repo.owner,
                repo: repo.repo,
                issue_number: existingIssue.number,
                body: `CI failure workflow re-ran: ${runUrl}`,
              });
              return;
            }

            const title = `CI Test Failure — Run #${runId}`;
            const body = [
              `## CI Test Failure`,
              ``,
              `A test **failed** in workflow run **#${runId}**.`,
              ``,
              `| Detail | Value |`,
              `|--------|-------|`,
              `| **Workflow** | ${{ github.workflow }} |`,
              `| **Run ID** | ${runId} |`,
              `| **Branch** | ${context.ref} |`,
              `| **Commit** | ${context.sha} |`,
              `| **Trigger** | ${context.eventName} |`,
              `| **Author** | ${context.actor} |`,
              `| **Python versions** | ${{ steps.matrix-info.outputs.matrix_versions }} |`, // noqa: E501
              ``,
              `🔗 [View workflow run](${runUrl})`,
              ``,
              marker,
              ``,
              `> This issue was automatically created when CI tests failed.`,
              `> Re-run the workflow to verify the fix.`,
            ].join('\n');

            for (const label of [
              {
                name: 'ci-failure',
                color: 'd73a4a',
                description: 'CI workflow failure',
              },
              {
                name: 'automated',
                color: 'ededed',
                description: 'Automatically managed by CI',
              },
            ]) {
              try {
                await github.rest.issues.createLabel({
                  owner: repo.owner,
                  repo: repo.repo,
                  ...label,
                });
              } catch (error) {
                if (error.status !== 422) throw error;
              }
            }

            await github.rest.issues.create({
              owner: repo.owner,
              repo: repo.repo,
              title: title,
              body: body,
              labels: ['ci-failure', 'automated']
            });
