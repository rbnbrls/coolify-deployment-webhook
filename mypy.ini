# ── Type-check configuration (mypy) ────────────────────────────────────────────
# CI runs `mypy` with no arguments: the `files` list below is the checked set.
#
# The three application modules are fully annotated and pass `strict`, so the
# gate is real rather than nominal. The test suite is intentionally out of scope
# (it is exercised by pytest); annotating it is a separate change.

[mypy]
python_version = 3.11
files = webhook_server.py, coolify_deployment_logs.py, github_issue_creator.py
strict = True
show_error_codes = True
warn_unused_configs = True
